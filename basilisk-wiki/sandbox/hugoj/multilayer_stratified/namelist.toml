# ============================================================
# Configuration file for the multi_layer model using Basilisk
#
#
#
#
# ============================================================
#
# INITIAL CONDITION
#
rho0 = 1025.0    # [kg.m-3] reference density
strat = 0.000002 # s^2
Ts = 20.0        # °C
cp = 4.2e3       # [J.kg-1.K-1] heat capacity water
alphaT = 2e-4    # Linear equation of state: drho = betaT*(T0-T) (Vallis 2.4)
Pr = 1.0         # Prandtl number
#
# DOMAIN DEFINITION
#
h0 = 50.0    # =2pi/kp, depth of water (m)N_grid = 64  # 1024=10 2^N_grid, number of x and y gridpoints
L = 50.0     # (m) domain size
N_layer = 64 # number of layers
N_grid = 64  # number of grid cells
#
# RUN PARAMETERS
#
tend = 3600.0 # (s) time to end the simu
dtout = 30.0  # (s) dt for output in netcdf

#
# SOLVER PARAMETERS
#
nu0 = 0.0025   # m2 s-2 Viscosity for vertical diffusion
RANDOM = 2     # random integer (>1) for random number generator
thetaH = 0.503 # theta_h for dumping fast barotropic modes


#
# FORCING
#
qt = -500.0 # W/m^2

#
# DIAGNOSTICS
#
dt_mean = 60.0 # s
